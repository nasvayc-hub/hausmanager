<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HausManager</title>
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HausManager">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0f172a;-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:760px){
  input,select{font-size:16px !important;width:100%}
  .hm-mobile [style*="max-width: 1000px"]{padding:16px 14px !important}
  .hm-mobile h1{font-size:22px !important}
  .hm-mobile [style*="minmax(200px"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important}
  .hm-mobile [style*="minmax(280px"]{grid-template-columns:1fr !important}
  .hm-nklabel{flex:1 1 auto !important;min-width:0}
  .hm-nkbar{display:none}
  .hm-mobile [style*="flex: 0 0 90px"]{flex:0 0 78px !important;font-size:12px}
  .hm-abr-header{padding:12px 14px !important}
  .hm-mobile [style*="padding: 9px 20px"],.hm-mobile [style*="padding: 10px 20px"]{padding-left:14px !important;padding-right:14px !important}
}
</style>
</head>
